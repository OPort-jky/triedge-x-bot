name: metrics

on:
  schedule:
    - cron: '0 15 * * *'  # 00:00 JST (深夜バッチ・投稿と重ならない時刻)
  workflow_dispatch:

concurrency:
  group: state-write
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Fetch metrics
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python scripts/fetch_metrics.py
      - name: Update strategy
        run: python scripts/update_strategy.py
      - name: Commit state
        run: |
          git config user.name "triedge-bot"
          git config user.email "bot@triedge.app"
          git add state/
          git diff --staged --quiet || git commit -m "chore(state): metrics + strategy $(date -u +%Y-%m-%d)"
          git push
