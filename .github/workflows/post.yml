name: post

on:
  schedule:
    # UTC 指定。JST = UTC+9。
    - cron: '30 22 * * *'  # 07:30 JST (morning)
    - cron: '30 3 * * *'   # 12:30 JST (noon)
    - cron: '0 12 * * *'   # 21:00 JST (night)
  workflow_dispatch:

# state/ 書き戻し系ワークフロー(post/metrics)を同時に走らせない
concurrency:
  group: state-write
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Generate + post
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/post.py
      - name: Commit history
        run: |
          git config user.name "triedge-bot"
          git config user.email "bot@triedge.app"
          git add state/history.jsonl
          git diff --staged --quiet || git commit -m "chore(state): posted at $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
