name: engage

on:
  schedule:
    # UTC 指定。JST = UTC+9。post cron (12:00 UTC = 21:00 JST night) と時間帯を離す。
    - cron: '30 5 * * *'  # 14:30 JST (昼〜午後・フィットネス層 active)
  workflow_dispatch:

# state/ 書き戻し系ワークフロー (post/metrics/engage) を同時に走らせない
concurrency:
  group: state-write
  cancel-in-progress: false

jobs:
  engage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Engage
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python scripts/engage.py
      - name: Commit state
        if: always()
        run: |
          git config user.name "triedge-bot"
          git config user.email "bot@triedge.app"
          git add state/engage_log.jsonl 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore(engage): $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
